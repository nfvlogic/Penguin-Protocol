<text x="12" y="205" opacity="0"><tspan fill="#cdd6f4"> Welcome to the Atlas team! Atlas  │ ls [FOLDER]</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0651;0.0656;0.985;1" dur="12.3s" repeatCount="indefinite"/></text>
<text x="12" y="226" opacity="0"><tspan fill="#cdd6f4"> is our internal stage-gate app    │   list the files in a folder (e.g. ls</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0692;0.0697;0.985;1" dur="12.3s" repeatCount="indefinite"/></text>
