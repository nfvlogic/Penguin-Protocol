<text x="345" y="22" fill="#a6adc8" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="middle">penguin.py</text>
<g font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" xml:space="preserve">
<text x="12" y="58" opacity="0"><tspan fill="#cdd6f4"></tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0371;0.0376;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="79" opacity="0"><tspan fill="#6c7086">──────────────────────────────────────────────────────────────────────────</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0412;0.0417;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="100" opacity="0"><tspan fill="#cdd6f4"> ATL-101  Operation Front Door                                       1/60</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0453;0.0458;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="121" opacity="0"><tspan fill="#cdd6f4"></tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0495;0.0500;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="142" opacity="0"><tspan fill="#cdd6f4"> ▄█▀█▀█▄   Your badge got you in. Prove your cover holds.</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0536;0.0541;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="163" opacity="0"><tspan fill="#cdd6f4"> ▀█▀▀▀█▀   Find the port Atlas uses on your machine.</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0577;0.0582;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="184" opacity="0"><tspan fill="#cdd6f4"></tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0618;0.0623;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="205" opacity="0"><tspan fill="#cdd6f4"> GOAL  Submit the local port number.</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0660;0.0665;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="226" opacity="0"><tspan fill="#cdd6f4"> TOOLS</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0701;0.0706;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="247" opacity="0"><tspan fill="#cdd6f4">   ls [FOLDER]  list the files in a folder (e.g. ls reports)</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0742;0.0747;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="268" opacity="0"><tspan fill="#cdd6f4">   cat FILE     show what is inside a file (e.g. cat notes.md)</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0783;0.0788;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="289" opacity="0"><tspan fill="#cdd6f4">   cd FOLDER    go into a folder; cd .. goes up, cd ~ goes home (e.g. cd</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0824;0.0829;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="310" opacity="0"><tspan fill="#cdd6f4">                projects)</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0866;0.0871;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="331" opacity="0"><tspan fill="#cdd6f4"> Found it? submit ANSWER    Stuck? hint    Briefing: task full</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0907;0.0912;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="352" opacity="0"><tspan fill="#6c7086">──────────────────────────────────────────────────────────────────────────</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0948;0.0953;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="373" opacity="0"><tspan fill="#cdd6f4"></tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0989;0.0994;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="394" opacity="0"><tspan fill="#cdd6f4">Pip: First time? Type  ls  to see what is here.</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1031;0.1036;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="415" opacity="0"><tspan fill="#a6e3a1" font-weight="bold">analyst@penguin</tspan><tspan fill="#cdd6f4">:</tspan><tspan fill="#89b4fa" font-weight="bold">~</tspan><tspan fill="#cdd6f4">$ </tspan><tspan fill="#f5e0dc">cat welcome.txt</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2102;0.2107;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="436" opacity="0"><tspan fill="#cdd6f4">Welcome to the Atlas team!</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2201;0.2206;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="457" opacity="0"><tspan fill="#cdd6f4">The code is in ~/atlas. Start with README.md there.</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2300;0.2305;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="478" opacity="0"><tspan fill="#a6e3a1" font-weight="bold">analyst@penguin</tspan><tspan fill="#cdd6f4">:</tspan><tspan fill="#89b4fa" font-weight="bold">~</tspan><tspan fill="#cdd6f4">$ </tspan><tspan fill="#f5e0dc">cd atlas</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3372;0.3377;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="499" opacity="0"><tspan fill="#a6e3a1" font-weight="bold">analyst@penguin</tspan><tspan fill="#cdd6f4">:</tspan><tspan fill="#89b4fa" font-weight="bold">~/atlas</tspan><tspan fill="#cdd6f4">$ </tspan><tspan fill="#f5e0dc">cat README.md</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4444;0.4449;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="520" opacity="0"><tspan fill="#cdd6f4"># Atlas</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4542;0.4547;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="541" opacity="0"><tspan fill="#cdd6f4">Internal stage-gate app (Flask + MySQL). Formerly COMPASS.</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4641;0.4646;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="562" opacity="0"><tspan fill="#cdd6f4"></tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4740;0.4745;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="583" opacity="0"><tspan fill="#cdd6f4">Run locally:</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4839;0.4844;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="604" opacity="0"><tspan fill="#cdd6f4">  flask run --port 5050</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4938;0.4943;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="625" opacity="0"><tspan fill="#cdd6f4"></tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5037;0.5042;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="646" opacity="0"><tspan fill="#cdd6f4">More setup help: docs/setup.md</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5136;0.5141;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="667" opacity="0"><tspan fill="#a6e3a1" font-weight="bold">analyst@penguin</tspan><tspan fill="#cdd6f4">:</tspan><tspan fill="#89b4fa" font-weight="bold">~/atlas</tspan><tspan fill="#cdd6f4">$ </tspan><tspan fill="#f5e0dc">submit 5050</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6208;0.6213;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="688" opacity="0"><tspan fill="#cdd6f4"></tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6307;0.6312;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="709" opacity="0"><tspan fill="#cdd6f4"> ▄█▀█▀█▄   ✓ Objective secured: Operation Front Door (ATL-101)</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6406;0.6411;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
<text x="12" y="730" opacity="0"><tspan fill="#cdd6f4"> ▀█▀▀▀█▀   Nice work, partner.</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6505;0.6510;0.985;1" dur="12.1s" repeatCount="indefinite"/></text>
